# Keep the familiar terminal tabs and clock on the second row.
set -g status-format[1] "#[align=left]#{T:status-left}#{W:#[range=window|#{window_index} #{E:window-status-style}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{E:window-status-current-style}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}}}#[align=right]#{T:status-right}"
set -g status-left-length 24
set -g status-right-length 24
set -g status-justify left
set -g status-left "#[fg=#fff8f5,bg=#fff8f5]  #[fg=#2d2420,bg=#e9dcd4]  #[fg=#2d2420,bg=#d8c7c4]  #[fg=#2d2420,bg=#bfe8ed]  #[fg=#bfe8ed,bg=#2d2420] "
set -g status-right "#[fg=#bdb0a8,bg=#2d2420] %H:%M "
set -g window-status-format "#[fg=#fff8f5,bg=#62534c]  #I  #W #[fg=#bdb0a8]× #[fg=#62534c,bg=#2d2420] "
set -g window-status-current-format "#[fg=#2d2420,bg=#bfe8ed,bold]  #W #[fg=#c4874c]● #[fg=#2d2420]× #[fg=#62534c,bg=#2d2420] "
set -g window-status-separator ""
set -g message-style "bg=#bfe8ed,fg=#2d2420,bold"
set -g mode-style "bg=#bfe8ed,fg=#2d2420"
set -g pane-border-style "fg=#62534c"
set -g pane-active-border-style "fg=#bfe8ed"

# Standard terminal multiplexer controls.
bind c new-window -n terminal -c "#{pane_current_path}"
bind C new-window -n terminal -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind q display-panes
bind x confirm-before -p "关闭当前终端窗口？(y/n)" kill-window
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux 配置已刷新"

# Fast tab switching: Ctrl+B then N/P, Left/Right, or a number.
bind Tab next-window
bind BTab previous-window
bind -r n next-window
bind -r p previous-window
bind -r Right next-window
bind -r Left previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Alt+Shift arrows move the current tab left or right.
bind -n M-S-Left swap-window -t -1 \; previous-window
bind -n M-S-Right swap-window -t +1 \; next-window

# Keep new windows in the current directory and make tabs easy to identify.
set -g automatic-rename off
set -g automatic-rename-format "#{pane_current_command}"
set -g allow-rename off
set -g aggressive-resize on
