# Terminal multiplexing for the Niri + Clavis setup.

set -g prefix C-b
set -g status on
set -g status-position top
set -g status-interval 5
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-panes-time 1200
set -g display-time 1200
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Keep the palette aligned with Kitty and Alacritty and use white-to-pale-blue accent blocks.
set -g status-style "bg=#2d2420,fg=#fff8f5"
set -g status 2
# First row is a deliberately dithered white-to-grey pixel gradient.
set -g status-format[0] "#[fill=#fff8f5]#[bg=#fff8f5] #[bg=#fff8f5] #[bg=#fef7f4] #[bg=#fff8f5] #[bg=#fef7f4] #[bg=#fef6f3] #[bg=#fff7f4] #[bg=#fef6f3] #[bg=#fdf5f2] #[bg=#fef7f4] #[bg=#fdf6f3] #[bg=#fef7f4] #[bg=#fdf6f3] #[bg=#fcf5f2] #[bg=#fef6f3] #[bg=#fdf5f2] #[bg=#fcf4f1] #[bg=#fdf5f2] #[bg=#fcf4f1] #[bg=#fbf3f0] #[bg=#fcf5f2] #[bg=#fbf3f0] #[bg=#fcf5f2] #[bg=#fcf4f1] #[bg=#fbf3f0] #[bg=#fcf4f1] #[bg=#fbf3f0] #[bg=#faf2ef] #[bg=#fbf3f0] #[bg=#faf2ef] #[bg=#f9f1ee] #[bg=#faf2ef] #[bg=#faf1ee] #[bg=#fbf3f0] #[bg=#faf2ef] #[bg=#f9f0ed] #[bg=#faf2ef] #[bg=#f9f1ee] #[bg=#f8f0ed] #[bg=#f9f1ee] #[bg=#f9f0ed] #[bg=#f8efec] #[bg=#f9f0ed] #[bg=#f8efec] #[bg=#f9f0ed] #[bg=#f8efec] #[bg=#f7eeeb] #[bg=#f8f0ed] #[bg=#f7efec] #[bg=#f7edea] #[bg=#f8efec] #[bg=#f7eeeb] #[bg=#f6edea] #[bg=#f7eeeb] #[bg=#f6edea] #[bg=#f7eeeb] #[bg=#f6edea] #[bg=#f6ece9] #[bg=#f7edea] #[bg=#f6ece9] #[bg=#f5ebe8] #[bg=#f6edea] #[bg=#f5ece9] #[bg=#f4eae7] #[bg=#f5ece9] #[bg=#f4ebe8] #[bg=#f6ece9] #[bg=#f5ebe8] #[bg=#f4eae7] #[bg=#f5ebe8] #[bg=#f4eae7] #[bg=#f3e9e6] #[bg=#f4eae7] #[bg=#f3e9e6] #[bg=#f3e8e5] #[bg=#f4eae7] #[bg=#f3e9e6] #[bg=#f4eae7] #[bg=#f3e9e6] #[bg=#f2e8e5] #[bg=#f3e9e6] #[bg=#f2e8e5] #[bg=#f1e7e4] #[bg=#f3e8e5] #[bg=#f2e7e4] #[bg=#f1e6e3] #[bg=#f2e8e5] #[bg=#f1e6e3] #[bg=#f2e8e5] #[bg=#f1e7e4] #[bg=#f0e6e3] #[bg=#f1e7e4] #[bg=#f1e6e3] #[bg=#f0e5e2] #[bg=#f1e6e3] #[bg=#f0e5e2] #[bg=#efe4e1] #[bg=#f0e5e2] #[bg=#efe4e1] #[bg=#f0e6e3] #[bg=#f0e5e2] #[bg=#efe3e0] #[bg=#f0e5e2] #[bg=#efe4e1] #[bg=#eee3e0] #[bg=#efe4e1] #[bg=#eee3e0] #[bg=#ede2df] #[bg=#eee3e0] #[bg=#eee2df] #[bg=#efe3e0] #[bg=#eee2df] #[bg=#ede1de] #[bg=#eee3e0] #[bg=#ede2df] #[bg=#ece0dd] #[bg=#ede2df] #[bg=#ece1de] #[bg=#ece0dd] #[bg=#ede1de] #[bg=#ece0dd] #[bg=#ede1de] #[bg=#ece0dd] #[bg=#ebdfdc] #[bg=#ece0dd] #[bg=#ebdfdc] #[bg=#ebdedb] #[bg=#ece0dd] #[bg=#ebdfdc] #[bg=#eaddda] #[bg=#ebdfdc] #[bg=#eadedb] #[bg=#ebdfdc] #[bg=#eadedb] #[bg=#e9ddda] #[bg=#ebdedb] #[bg=#eaddda] #[bg=#e9dcd9] #[bg=#eaddda] #[bg=#e9dcd9] 