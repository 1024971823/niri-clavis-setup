[terminal.shell]
program = "tmux"
args = ["new-session", "-n", "terminal"]

[window]
decorations = "None"
opacity = 0.82
blur = true
dynamic_padding = true
title = "Terminal"

[window.padding]
x = 14
y = 12

[font]
size = 11.5

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[colors.primary]
background = "#2d2420"
foreground = "#fff8f5"
dim_foreground = "#bdb0a8"
bright_foreground = "#fff8f5"

[colors.cursor]
text = "#fff8f5"
cursor = "#397c91"

[colors.vi_mode_cursor]
text = "#fff8f5"
cursor = "#b75b78"

[colors.search.matches]
foreground = "#2d2420"
background = "#ffdcc5"

[colors.search.focused_match]
foreground = "#fff8f5"
background = "#397c91"

[colors.footer_bar]
foreground = "#2d2420"
background = "#e9dcd4"

[colors.hints.start]
foreground = "#fff8f5"
background = "#a2652d"

[colors.hints.end]
foreground = "#fff8f5"
background = "#64723b"

[colors.selection]
text = "#2d2420"
background = "#bfe8ed"

[colors.normal]
black = "#62534c"
red = "#e06d6d"
green = "#87964f"
yellow = "#c4874c"
blue = "#5c9fb1"
magenta = "#d57a58"
cyan = "#52a99d"
white = "#fff8f5"

[colors.bright]
black = "#62534c"
red = "#e06d6d"
green = "#87964f"
yellow = "#c4874c"
blue = "#5c9fb1"
magenta = "#d57a98"
cyan = "#52a99d"
white = "#fff8f5"

[colors.dim]
black = "#62534c"
red = "#a45a59"
green = "#687044"
yellow = "#8b673f"
blue = "#547986"
magenta = "#8c6170"
cyan = "#477870"
white = "#bdb0a8"

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

[bell]
duration = 120
color = "#ffdcc5"
