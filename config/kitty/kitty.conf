# Niri terminal appearance, mapped from the Alacritty preset.

font_family JetBrainsMono Nerd Font
font_size 14.0
shell_integration no-cursor

foreground #fff8f5
background #2d2420
selection_foreground #2d2420
selection_background #bfe8ed
cursor #397c91
cursor_text_color #fff8f5
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0

# Keep Kitty's smooth cursor motion visible while matching the terminal palette.
cursor_trail 1
cursor_trail_decay 0.12 0.42
cursor_trail_start_threshold 2
cursor_trail_color none

color0 #62534c
color1 #e06d6d
color2 #87964f
color3 #c4874c
color4 #5c9fb1
color5 #d57a58
color6 #52a99d
color7 #fff8f5
color8 #62534c
color9 #e06d6d
color10 #87964f
color11 #c4874c
color12 #5c9fb1
color13 #d57a98
color14 #52a99d
color15 #fff8f5

background_opacity 0.82
dynamic_background_opacity yes
background_blur 8
hide_window_decorations yes
window_padding_width 12 14
placement_strategy center
mouse_hide_wait 0.5
copy_on_select clipboard

enable_audio_bell no
visual_bell_duration 0.12
visual_bell_color #ffdcc5
bell_border_color #ffdcc5
active_border_color #bfe8ed
inactive_border_color #62534c

repaint_delay 8
input_delay 2
sync_to_monitor yes

# Preserve the existing tmux tabs and white pixel-gradient status row.
shell tmux new-session -n terminal
